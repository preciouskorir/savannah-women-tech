name: Build and deploy Python app to Azure Web App - savanahwomentech

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/
            !.github/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C65F90FC74B24994A0DEA0DA62FFE53B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_053AB8F9A12C4D1795D2BC8FDFEA850B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5C34CC9C9C1B43BD995C3B3A10D64A43 }}

      - name: Configure Django production settings
        shell: bash
        run: |
          APP_NAME="savanahwomentech-hdckh8a6fhhbbraz"

          RESOURCE_GROUP=$(az resource list \
            --name "$APP_NAME" \
            --resource-type "Microsoft.Web/sites" \
            --query "[0].resourceGroup" \
            --output tsv)

          if [ -z "$RESOURCE_GROUP" ]; then
            echo "ERROR: Could not find the Azure App Service resource group."
            exit 1
          fi

          echo "Using resource group: $RESOURCE_GROUP"

          EXISTING_KEY=$(az webapp config appsettings list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query "[?name=='DJANGO_SECRET_KEY'].name" \
            --output tsv)

          if [ -z "$EXISTING_KEY" ]; then
            echo "DJANGO_SECRET_KEY does not exist. Creating one..."

            SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(64))")

            echo "::add-mask::$SECRET_KEY"

            az webapp config appsettings set \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --settings \
                DJANGO_SECRET_KEY="$SECRET_KEY" \
                DJANGO_DEBUG=false
          else
            echo "DJANGO_SECRET_KEY already exists. Keeping the existing secret."

            az webapp config appsettings set \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --settings \
                DJANGO_DEBUG=false
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'savanahwomentech-hdckh8a6fhhbbraz'
          slot-name: 'Production'
          package: .
